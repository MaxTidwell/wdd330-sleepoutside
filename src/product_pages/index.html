<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Product Make and Name</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/product.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="product-detail">
        <h2>Product Details</h2>
        <figure>
          <img src="" alt="" id="productImage" width="300" />
        </figure>
        <section id="product-info">
          <h3 id="productBrand"></h3>
          <p id="productName"></p>

          <p id="productColor" class="product__color">Color</p>
          <p id="productDesc" class="product__description">Description</p>
          <p id="productPrice" class="product-card__price">$000.99</p>
          <button id="add-to-Cart" data-id="">Add to Cart</button>
        </section>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
